name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub release
  id-token: write  # npm provenance (OIDC)

jobs:
  publish:
    name: Build, test & publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # --provenance is disabled for now: granular access tokens cannot yet
      # generate provenance attestations; revisit when npm GAT support lands
      # (or switch to trusted publishing once the package exists).
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/treemap-heatmap.min.js
