<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念板块热力图 · treemap-heatmap demo</title>
    <style>
      :root {
        --bg: #0b0e14;
        --line: rgba(255, 255, 255, 0.14);
        --txt: #e8eaed;
        --muted: #9aa0aa;
        --up: #ff6b6b;
        --down: #4ade80;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px 8px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      h1 .en {
        margin-left: 8px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .meta {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .meta span {
        font-size: 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .hd-right {
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }
      .views {
        display: flex;
        gap: 2px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px;
      }
      .views button {
        background: transparent;
        border: 0;
        border-radius: 6px;
        color: var(--muted);
        font-family: inherit;
        font-size: 12px;
        padding: 4px 12px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .views button:hover {
        color: var(--txt);
        background: rgba(255, 255, 255, 0.08);
      }
      .views button.on {
        background: rgba(255, 255, 255, 0.18);
        color: var(--txt);
        font-weight: 700;
      }
      .legend {
        min-width: 190px;
      }
      .lg-title {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 4px;
        letter-spacing: 1px;
      }
      .lg-bar {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          rgb(0, 100, 0) 0%,
          rgb(101, 137, 90) 25%,
          rgb(172, 172, 172) 50%,
          rgb(206, 115, 114) 75%,
          rgb(220, 20, 60) 100%
        );
      }
      .lg-scale {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: var(--muted);
        margin-top: 3px;
      }
      .area-note {
        font-size: 10px;
        color: var(--muted);
        padding-bottom: 2px;
        white-space: nowrap;
      }
      #crumb {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px 8px;
        font-size: 12px;
        color: var(--muted);
        min-height: 27px;
        flex-wrap: wrap;
      }
      #backBtn {
        background: rgba(255, 255, 255, 0.08);
        color: var(--txt);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11px;
        padding: 3px 10px;
        cursor: pointer;
        font-family: inherit;
      }
      #backBtn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      #crumbText b {
        color: var(--txt);
        font-size: 13px;
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }
      .flat {
        color: #acacac;
      }
      main {
        flex: 1;
        padding: 0 16px 14px;
        min-height: 0;
      }
      #plot {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #buildHint {
        display: none;
        margin: 40px auto;
        max-width: 640px;
        padding: 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }
      #buildHint code {
        color: var(--txt);
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>概念板块热力图<span class="en">treemap-heatmap</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="hd-right">
        <div class="views" id="views">
          <button data-p="day" class="on">日</button>
          <button data-p="week">周</button>
          <button data-p="month">月</button>
          <button data-p="year">年</button>
        </div>
        <div class="legend">
          <div class="lg-title">颜色 = 平均涨幅（±10% 封顶）</div>
          <div class="lg-bar"></div>
          <div class="lg-scale"><span>-10%</span><span>0</span><span>+10%</span></div>
        </div>
        <div class="area-note">面积 = 涨股比 up / n × 1000 + 1<br />涨幅 0 为中性灰 · 点击可放大</div>
      </div>
    </header>
    <div id="crumb">
      <button id="backBtn" hidden>← 返回全部大类</button>
      <span id="crumbText"></span>
    </div>
    <main><div id="plot"></div></main>
    <div id="buildHint"></div>

    <!-- Classic scripts on purpose: the demo also works when opened via file:// -->
    <script src="data.js"></script>
    <script src="../dist/treemap-heatmap.js"></script>
    <script src="app.js"></script>
  </body>
</html>
