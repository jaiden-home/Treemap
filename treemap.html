<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概念板块热力图 · Treemap</title>
<style>
  :root {
    --bg: #0b0e14;
    --line: rgba(255,255,255,.14);
    --txt: #e8eaed;
    --muted: #9aa0aa;
    --up: #ff6b6b;
    --down: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 12px 16px 8px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  h1 .en { margin-left: 8px; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
  .meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .meta span {
    font-size: 11px; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .hd-right { display: flex; align-items: flex-end; gap: 18px; }
  .legend { min-width: 190px; }
  .lg-title { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  .lg-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(27,120,50) 0%, rgb(108,147,110) 25%, rgb(172,172,172) 50%, rgb(198,124,113) 75%, rgb(207,67,57) 100%); }
  .lg-scale { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-top: 3px; }
  .area-note { font-size: 10px; color: var(--muted); padding-bottom: 2px; white-space: nowrap; }
  #crumb { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; font-size: 12px; color: var(--muted); min-height: 27px; flex-wrap: wrap; }
  #backBtn {
    background: rgba(255,255,255,.08); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; font-size: 11px; padding: 3px 10px; cursor: pointer; font-family: inherit;
  }
  #backBtn:hover { background: rgba(255,255,255,.16); }
  #crumbText b { color: var(--txt); font-size: 13px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  main { flex: 1; padding: 0 16px 14px; min-height: 0; }
  #plot { position: relative; width: 100%; height: 100%; }
</style>
</head>
<body>
<header>
  <div>
    <h1>概念板块热力图<span class="en">Treemap</span></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="hd-right">
    <div class="legend">
      <div class="lg-title">颜色 = 涨股比 up / evalN</div>
      <div class="lg-bar"></div>
      <div class="lg-scale"><span>0%</span><span>50%</span><span>100%</span></div>
    </div>
    <div class="area-note">面积 = 成分股数（可切 |涨幅|）<br>颜色锚点 = 50% 涨股比 · 点击可放大</div>
  </div>
</header>
<div id="crumb">
  <button id="backBtn" hidden>← 返回全部大类</button>
  <span id="crumbText"></span>
</div>
<main><div id="plot"></div></main>

<script src="data.js"></script>
<script src="treemap.js"></script>
<script>
(function () {
  'use strict';
  var backBtn = document.getElementById('backBtn');
  var crumbText = document.getElementById('crumbText');

  /* 单一数据源：data.js（file:// 直开同样可用，无需内嵌副本） */
  var data = window.HEATMAP_DATA;
  var m = data.meta;

  function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

  function chrome(cat) {
    if (!cat) {
      backBtn.hidden = true;
      crumbText.innerHTML = '全部 ' + m.categories + ' 个大类 · ' + m.concepts +
        ' 个子概念（提示：点击单元格放大对应大类，Esc 返回）';
    } else {
      backBtn.hidden = false;
      crumbText.innerHTML = '<b>' + cat.name + '</b>　平均 <span class="' + (cat.avgPct >= 0 ? 'up' : 'down') + '">' +
        fmtPct(cat.avgPct) + '</span>　涨股比 ' + cat.up + '/' + cat.evalN +
        '　领涨 ' + cat.leader.name + ' ' + fmtPct(cat.leader.pct);
    }
  }

  document.getElementById('meta').innerHTML =
    '<span>' + m.lastDate + '</span>' +
    '<span>' + m.stocksEvaluated + ' 只个股</span>' +
    '<span>' + m.categories + ' 大类</span>' +
    '<span>' + m.concepts + ' 概念</span>' +
    '<span>数据源 data.js（示例数据）</span>';

  /* 像 D3 一样使用插件：Treemap(容器).data(数据).on(事件).render() */
  var chart = Treemap('#plot')
    .data(data)
    .on('zoom', function (cat) { chrome(cat); })
    .on('back', function () { chrome(null); })
    .render();

  backBtn.addEventListener('click', function () { chart.back(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') chart.back(); });
  chrome(null);
})();
</script>
</body>
</html>
